[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nilered-bz-reaction-twin"
version = "0.1.0"
description = "A safe, normalized BZ-reaction companion with a Rowan-gated mechanism path"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vicena"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
[project.optional-dependencies]
test = ["pytest>=7.0"]
[project.scripts]
nilered-twin = "nilered_twin.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
